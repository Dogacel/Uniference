<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Log Visualization</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Event Log Visualization</h1>
        <div>
            <label for="eventSelector">Select Event File:</label>
            <input type="file" id="eventSelector" accept=".jsonl">
        </div>
        <div>
            <label for="timeSlider">Event Time Slider:</label>
            <input type="range" id="timeSlider" min="0" max="100" step="1" value="0">
        </div>
        <div id="eventDisplay"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
